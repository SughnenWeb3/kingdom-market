services:
  db:
    image: postgres:17-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: kingdom_market
      POSTGRES_USER: kingdom_market
      POSTGRES_PASSWORD: kingdom_market_dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kingdom_market -d kingdom_market']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  db-test:
    image: postgres:17-alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_DB: kingdom_market_test
      POSTGRES_USER: kingdom_market
      POSTGRES_PASSWORD: kingdom_market_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kingdom_market -d kingdom_market_test']
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres-data:
